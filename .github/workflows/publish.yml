# Publishes to PyPI when a version tag (v0.1.0, v0.1.0b0) is pushed.
# No API token: PyPI trusts this workflow (trusted publishing), configured on
# pypi.org for owner ZapSMTP, repository zapsmtp-python, workflow publish.yml,
# environment pypi.
#
# The full test suite needs the shared conformance cases and spec of the
# ZapSMTP SDK monorepo and runs there (Python 3.9 to 3.13) before a release is
# exported here; this workflow checks the built package itself.
name: publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tag matches the package version
        run: |
          v=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          grep -q "__version__ = \"$v\"" src/zapsmtp/_version.py
          [ "${GITHUB_REF_NAME}" = "v$v" ] || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - run: pip install build twine && python -m build && twine check --strict dist/*
      - name: The wheel installs and imports
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          cd /tmp && /tmp/v/bin/python -c 'import zapsmtp; c = zapsmtp.ZapSMTP(api_key="zap_test"); print(zapsmtp.__version__, c.base_url)'
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
